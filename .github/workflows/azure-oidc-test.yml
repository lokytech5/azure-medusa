name: Azure OIDC Authentication Test


on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    test-azure-login:
        runs-on: ubuntu-latest
        environment: dev


        steps:
            - name: Authenticate to Azure using OIDC
              uses: azure/login@v3
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Verify Azure identity and subscription
              run: |
                az account show \
                  --query "{subscription: name, tenantId: tenantId, identityType: user.type}" \
                  --output json

            - name: Read Medusa resource group
              run: |
                az group show \
                  --name rg-medusa-dev \
                  --query "{name: name, location: location, id: id}" \
                  --output json